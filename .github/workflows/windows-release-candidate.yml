# Windows release-candidate build: test suite, PyInstaller build (packaging/build_windows.ps1),
# and the frozen self-test under a fresh, empty user profile. Uses synthetic data only.
name: Windows release candidate

on:
  workflow_dispatch:
  push:
    branches: [claude/foundation]

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests, build and frozen self-test
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Self-test as a new user (empty APPDATA / LOCALAPPDATA, no development environment)
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "fresh-user"
          New-Item -ItemType Directory -Force -Path "$profile\Roaming", "$profile\Local" | Out-Null
          $env:APPDATA = "$profile\Roaming"
          $env:LOCALAPPDATA = "$profile\Local"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          .\dist\SurveyLicensingStudio\SurveyLicensingStudio-console.exe self-test --report dist\selftest-fresh-user.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse $profile | Select-Object FullName | Out-String | Write-Host
          if (Test-Path dist\SurveyLicensingStudio\data) { Write-Error "user data was written into the installation folder"; exit 1 }

      - name: Upload the distribution folder and self-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurveyLicensingStudio-windows-rc
          path: |
            dist/SurveyLicensingStudio
            dist/selftest*.json
          if-no-files-found: warn

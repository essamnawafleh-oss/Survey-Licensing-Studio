[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-licensing-studio"
version = "0.1.0"
description = "Local-first CAD and building licensing automation for survey departments"
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "PySide6-Addons>=6.7,<7",
  "ezdxf>=1.3,<2",
  "shapely>=2.0,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0.1,<3",
  "pyproj>=3.6,<4",
  "pyshp>=2.3,<3",
  "reportlab>=4.2,<6",
  "pypdf>=4.0,<7",
  "Pillow>=10",
  "arabic-reshaper>=3.0,<4",
  "python-bidi>=0.4.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "xlwt>=1.3"]

[project.scripts]
sls = "sls.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sls = ["resources/fonts/*", "resources/i18n/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
